plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def madeBy = "Made with love by Armando Meziat"

android {
    compileSdk = 37

    defaultConfig {
        applicationId "com.radiojhero.app"
        minSdk 29
        targetSdk 37
        versionCode 21
        versionName "6.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Remote configuration; pass -PconfigUrl=... to point a build at a local API.
        buildConfigField "String", "CONFIG_URL", "\"${project.findProperty('configUrl') ?: 'https://api.radiojhero.com/android-app.properties'}\""
    }

    buildTypes {
        debug {
            versionNameSuffix defaultConfig.versionName.contains("-") ? ".SNAPSHOT" : "-SNAPSHOT"
            resValue "string", "version_name", "${defaultConfig.versionName}${versionNameSuffix}"
            resValue "string", "version_name_and_text", "v${defaultConfig.versionName}${versionNameSuffix} - ${madeBy}"
        }

        release {
            resValue "string", "version_name", defaultConfig.versionName
            resValue "string", "version_name_and_text", "v${defaultConfig.versionName} - ${madeBy}"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    namespace 'com.radiojhero.app'
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'com.algolia:algoliasearch-client-kotlin:3.46.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.onesignal:OneSignal:5.9.7'
    implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.3'
    implementation 'io.ktor:ktor-client-android:3.5.1'
    implementation 'io.sentry:sentry-android:8.50.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
